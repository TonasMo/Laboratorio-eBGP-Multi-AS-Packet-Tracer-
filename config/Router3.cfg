enable
configure terminal
hostname R3

interface Loopback0
 ip address 4.4.4.4 255.255.255.255

interface GigabitEthernet0/0
 ip address 150.1.1.3 255.255.255.0
 no shutdown

interface Serial0/2/0
 ip address 10.0.0.13 255.255.255.0
 no shutdown

interface Serial0/3/1
 ip address 10.0.0.17 255.255.255.0
 no shutdown

router bgp 4
 bgp router-id 4.4.4.4
 neighbor 150.1.1.1 remote-as 1
 neighbor 10.0.0.14 remote-as 3
 neighbor 10.0.0.18 remote-as 3
 network 4.4.4.4 mask 255.255.255.255
exit